<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">Rung 544 native closer correctness by delimiter</title>
  <desc id="desc">Parenthesis, square bracket, and quote are 100 percent correct. Curly brace is 0 percent correct. The preregistered threshold is 75 percent.</desc>
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold">Native model capability on R544 FIT + SELECT</text>
  <text x="380" y="53" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Correct closer beats the other three closer tokens</text>
  <line x1="90" y1="260" x2="720" y2="260" stroke="#333"/>
  <line x1="90" y1="80" x2="90" y2="260" stroke="#333"/>
  <line x1="90" y1="125" x2="720" y2="125" stroke="#c33" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="715" y="118" text-anchor="end" font-family="sans-serif" font-size="12" fill="#a22">75% preregistered bar</text>
  <text x="78" y="264" text-anchor="end" font-family="sans-serif" font-size="12">0%</text>
  <text x="78" y="219" text-anchor="end" font-family="sans-serif" font-size="12">25%</text>
  <text x="78" y="174" text-anchor="end" font-family="sans-serif" font-size="12">50%</text>
  <text x="78" y="129" text-anchor="end" font-family="sans-serif" font-size="12">75%</text>
  <text x="78" y="84" text-anchor="end" font-family="sans-serif" font-size="12">100%</text>
  <rect x="125" y="80" width="105" height="180" rx="3" fill="#377eb8"/>
  <rect x="280" y="80" width="105" height="180" rx="3" fill="#4daf4a"/>
  <rect x="435" y="258" width="105" height="2" rx="1" fill="#e41a1c"/>
  <rect x="590" y="80" width="105" height="180" rx="3" fill="#984ea3"/>
  <text x="177" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">100%</text>
  <text x="332" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">100%</text>
  <text x="487" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b11">0%</text>
  <text x="642" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">100%</text>
  <text x="177" y="285" text-anchor="middle" font-family="sans-serif" font-size="14">parenthesis )</text>
  <text x="332" y="285" text-anchor="middle" font-family="sans-serif" font-size="14">square ]</text>
  <text x="487" y="285" text-anchor="middle" font-family="sans-serif" font-size="14">curly }</text>
  <text x="642" y="285" text-anchor="middle" font-family="sans-serif" font-size="14">quote &quot;</text>
  <text x="380" y="316" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">Both answer-changing constructions and both directions; each value is exact in every tested cell.</text>
</svg>
