<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Fresh numeric circuit capability gates</title>
  <desc id="desc">Percentage bars for the weakest cell in each preregistered evidence group.</desc>
  <rect width="900" height="420" fill="#fbfbfd"/>
  <text x="30" y="36" font-family="sans-serif" font-size="22" font-weight="700" fill="#202124">Fresh numeric circuit gates — weakest opened cell</text>
  <text x="30" y="62" font-family="sans-serif" font-size="14" fill="#5f6368">Percent of groups passing the registered directional condition; dashed line is the 75% bar.</text>
  <line x1="650" y1="82" x2="650" y2="375" stroke="#c5221f" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="657" y="99" font-family="sans-serif" font-size="13" fill="#c5221f">75% required</text>
  <g font-family="sans-serif" font-size="15" fill="#202124">
    <text x="30" y="130">List state shifts</text><rect x="250" y="108" width="540" height="28" rx="4" fill="#3973ac"/><text x="800" y="129">100%</text>
    <text x="30" y="181">List invariances (weakest)</text><rect x="250" y="159" width="405" height="28" rx="4" fill="#6b9ac4"/><text x="665" y="180">75%</text>
    <text x="30" y="232">List +2 conflict</text><rect x="250" y="210" width="540" height="28" rx="4" fill="#3973ac"/><text x="800" y="231">100%</text>
    <text x="30" y="283">Sequence state shifts</text><rect x="250" y="261" width="540" height="28" rx="4" fill="#2a9d68"/><text x="800" y="282">100%</text>
    <text x="30" y="334">Sequence invariances</text><rect x="250" y="312" width="540" height="28" rx="4" fill="#2a9d68"/><text x="800" y="333">100%</text>
    <text x="30" y="385">Middle-edit margin drop</text><rect x="250" y="363" width="540" height="28" rx="4" fill="#2a9d68"/><text x="800" y="384">100%</text>
  </g>
  <line x1="250" y1="400" x2="790" y2="400" stroke="#9aa0a6"/>
  <text x="246" y="416" font-family="sans-serif" font-size="12" fill="#5f6368">0%</text><text x="775" y="416" font-family="sans-serif" font-size="12" fill="#5f6368">100%</text>
</svg>
