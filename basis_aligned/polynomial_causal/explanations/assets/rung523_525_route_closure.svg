<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Rungs 523 to 525: optimizer route closes and task-free MLP0 grouping fails its raw-token control</title>
  <desc id="desc">The upper chart shows percentages of successful optimizer fits: 46.7, 6.7, 33.3, and zero. The lower chart shows the selected MLP0 operator-pair distance as a percentage of three controls: 123.5 percent of raw-token-neighbor distance, 58.6 percent of random-token distance, and 72.9 percent of scrambled-signature distance. Lower is better.</desc>
  <rect width="1100" height="620" fill="#fbfbf8"/>
  <style>
    .title{font:700 25px system-ui,sans-serif;fill:#18212b}.subtitle{font:16px system-ui,sans-serif;fill:#52606d}
    .label{font:15px system-ui,sans-serif;fill:#26323d}.small{font:13px system-ui,sans-serif;fill:#52606d}
    .value{font:700 15px system-ui,sans-serif;fill:#18212b}.axis{stroke:#9aa5b1;stroke-width:1}.grid{stroke:#d9dee3;stroke-width:1}
    .bad{fill:#d75a4a}.mixed{fill:#e5a742}.good{fill:#3d8f72}.neutral{fill:#6688aa}
  </style>
  <text x="48" y="42" class="title">Why the route changed after rungs 523–525</text>
  <text x="48" y="70" class="subtitle">Percentages report the actual registered measurements; no rank or compression credit is implied.</text>

  <text x="48" y="112" class="label">Optimizer fits that passed their held-out health check</text>
  <line x1="310" y1="132" x2="1010" y2="132" class="axis"/>
  <line x1="310" y1="132" x2="310" y2="300" class="axis"/>
  <line x1="450" y1="132" x2="450" y2="300" class="grid"/><line x1="590" y1="132" x2="590" y2="300" class="grid"/>
  <line x1="730" y1="132" x2="730" y2="300" class="grid"/><line x1="870" y1="132" x2="870" y2="300" class="grid"/>
  <line x1="1010" y1="132" x2="1010" y2="300" class="grid"/>
  <text x="306" y="124" class="small">0%</text><text x="436" y="124" class="small">20%</text><text x="576" y="124" class="small">40%</text>
  <text x="716" y="124" class="small">60%</text><text x="856" y="124" class="small">80%</text><text x="990" y="124" class="small">100%</text>
  <text x="48" y="164" class="label">R523 fixed scale, lr .003</text><rect x="310" y="146" width="327" height="25" rx="3" class="mixed"/><text x="646" y="164" class="value">46.7% (7/15)</text>
  <text x="48" y="204" class="label">R523 fixed scale, lr .03</text><rect x="310" y="186" width="47" height="25" rx="3" class="bad"/><text x="366" y="204" class="value">6.7% (1/15)</text>
  <text x="48" y="244" class="label">R523 row scale, lr .003</text><rect x="310" y="226" width="233" height="25" rx="3" class="bad"/><text x="552" y="244" class="value">33.3% (5/15)</text>
  <text x="48" y="284" class="label">R524 planted direct-subspace</text><rect x="310" y="266" width="2" height="25" class="bad"/><text x="322" y="284" class="value">0% (0/15)</text>

  <text x="48" y="350" class="label">R525 selected-pair distance on new documents, relative to each control</text>
  <text x="48" y="374" class="small">Lower is better. Each gray control distance is 100%; the colored bar is the chosen operator pair.</text>
  <line x1="310" y1="400" x2="1010" y2="400" class="axis"/><line x1="310" y1="400" x2="310" y2="554" class="axis"/>
  <line x1="543" y1="400" x2="543" y2="554" class="grid"/><line x1="777" y1="400" x2="777" y2="554" class="grid"/><line x1="1010" y1="400" x2="1010" y2="554" class="grid"/>
  <text x="306" y="392" class="small">0%</text><text x="530" y="392" class="small">50%</text><text x="762" y="392" class="small">100%</text><text x="992" y="392" class="small">150%</text>
  <text x="48" y="435" class="label">versus nearest raw-token neighbor</text><rect x="310" y="417" width="576" height="25" rx="3" class="bad"/><text x="895" y="435" class="value">123.5% (pass ≤75%)</text>
  <text x="48" y="479" class="label">versus far-random token</text><rect x="310" y="461" width="273" height="25" rx="3" class="mixed"/><text x="592" y="479" class="value">58.6% (pass ≤25%)</text>
  <text x="48" y="523" class="label">versus scrambled signature</text><rect x="310" y="505" width="340" height="25" rx="3" class="good"/><text x="659" y="523" class="value">72.9% (pass ≤75%)</text>
  <text x="48" y="588" class="subtitle">Conclusion: the task-free operator sketch is real and stable, but ordinary token similarity predicts it better.</text>
</svg>
