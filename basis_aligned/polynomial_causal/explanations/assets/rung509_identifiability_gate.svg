<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Rung509 planted identifiability gate</title>
  <desc id="desc">Four horizontal bars show achieved recovery as a percentage of the registered passing requirement. All are below one hundred percent.</desc>
  <rect width="920" height="430" fill="#ffffff"/>
  <text x="30" y="38" font-family="sans-serif" font-size="22" font-weight="bold" fill="#172033">Rung509: recovery on a known eight-atom toy</text>
  <text x="30" y="64" font-family="sans-serif" font-size="14" fill="#4a5568">Bar length = achieved value / required passing value; 100% is the frozen gate.</text>
  <line x1="265" y1="82" x2="265" y2="370" stroke="#cbd5e0"/>
  <line x1="765" y1="82" x2="765" y2="370" stroke="#b83280" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="765" y="395" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#97266d">100% required</text>

  <text x="245" y="125" text-anchor="end" font-family="sans-serif" font-size="15" fill="#172033">Response direction</text>
  <rect x="265" y="102" width="500" height="34" rx="4" fill="#edf2f7"/>
  <rect x="265" y="102" width="196.4" height="34" rx="4" fill="#dd6b20"/>
  <text x="475" y="125" font-family="sans-serif" font-size="14" fill="#172033">39.3%  (0.354 / 0.90)</text>

  <text x="245" y="195" text-anchor="end" font-family="sans-serif" font-size="15" fill="#172033">Term assignments</text>
  <rect x="265" y="172" width="500" height="34" rx="4" fill="#edf2f7"/>
  <rect x="265" y="172" width="419.7" height="34" rx="4" fill="#d69e2e"/>
  <text x="698" y="195" font-family="sans-serif" font-size="14" fill="#172033">83.9%  (0.672 / 0.80)</text>

  <text x="245" y="265" text-anchor="end" font-family="sans-serif" font-size="15" fill="#172033">Learned anchor weight</text>
  <rect x="265" y="242" width="500" height="34" rx="4" fill="#edf2f7"/>
  <rect x="265" y="242" width="1" height="34" rx="1" fill="#c53030"/>
  <text x="280" y="265" font-family="sans-serif" font-size="14" fill="#172033">0.11%  (0.000993 / 0.90)</text>

  <text x="245" y="335" text-anchor="end" font-family="sans-serif" font-size="15" fill="#172033">Correct anchor identities</text>
  <rect x="265" y="312" width="500" height="34" rx="4" fill="#edf2f7"/>
  <rect x="265" y="312" width="385.4" height="34" rx="4" fill="#d69e2e"/>
  <text x="664" y="335" font-family="sans-serif" font-size="14" fill="#172033">77.1%  (37 / 48; 48 required)</text>

  <text x="30" y="418" font-family="sans-serif" font-size="13" fill="#4a5568">No model weights or model responses were evaluated; this is a CPU ground-truth instrument test.</text>
</svg>
