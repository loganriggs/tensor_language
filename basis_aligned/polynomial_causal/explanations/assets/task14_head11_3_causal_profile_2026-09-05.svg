<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460" role="img" aria-labelledby="title desc">
  <title id="title">Task14 head 11.3 causal evidence and unrelated-behavior collateral</title>
  <desc id="desc">Horizontal percentage bars show about 63 percent donor transfer, 50 percent agreement margin damage under removal, and near-zero unrelated-behavior collateral.</desc>
  <rect width="980" height="460" fill="#ffffff"/>
  <text x="28" y="32" font-family="sans-serif" font-size="20" font-weight="700" fill="#172033">Head 11.3: task effect versus unrelated-behavior collateral</text>
  <text x="28" y="57" font-family="sans-serif" font-size="13" fill="#526070">Percent of each experiment's native reference scale; transfer and removal are different measurements.</text>
  <line x1="300" y1="82" x2="300" y2="420" stroke="#9aa5b1" stroke-width="1"/>
  <line x1="450" y1="82" x2="450" y2="420" stroke="#e1e6eb" stroke-width="1"/>
  <line x1="600" y1="82" x2="600" y2="420" stroke="#e1e6eb" stroke-width="1"/>
  <line x1="750" y1="82" x2="750" y2="420" stroke="#e1e6eb" stroke-width="1"/>
  <line x1="900" y1="82" x2="900" y2="420" stroke="#e1e6eb" stroke-width="1"/>
  <g font-family="sans-serif" font-size="12" fill="#526070" text-anchor="middle">
    <text x="300" y="78">0%</text><text x="450" y="78">25%</text><text x="600" y="78">50%</text><text x="750" y="78">75%</text><text x="900" y="78">100%</text>
  </g>
  <text x="28" y="108" font-family="sans-serif" font-size="14" font-weight="700" fill="#172033">Donor interchange: how much of the native answer change is transferred</text>
  <g font-family="sans-serif" font-size="13" fill="#263244">
    <text x="285" y="139" text-anchor="end">held-out syntax</text><rect x="300" y="122" width="376.4" height="24" rx="3" fill="#3975c6"/><text x="684" y="139">62.7%</text>
    <text x="285" y="177" text-anchor="end">different nouns</text><rect x="300" y="160" width="377.4" height="24" rx="3" fill="#3975c6"/><text x="685" y="177">62.9%</text>
  </g>
  <text x="28" y="220" font-family="sans-serif" font-size="14" font-weight="700" fill="#172033">Literal removal: loss of correct agreement margin</text>
  <g font-family="sans-serif" font-size="13" fill="#263244">
    <text x="285" y="251" text-anchor="end">A1 prepositional syntax</text><rect x="300" y="234" width="299.8" height="24" rx="3" fill="#d96b3b"/><text x="607" y="251">50.0%</text>
    <text x="285" y="289" text-anchor="end">A2 relative-clause syntax</text><rect x="300" y="272" width="301.2" height="24" rx="3" fill="#d96b3b"/><text x="609" y="289">50.2%</text>
  </g>
  <text x="28" y="332" font-family="sans-serif" font-size="14" font-weight="700" fill="#172033">Unrelated-behavior collateral: absolute margin movement under removal</text>
  <g font-family="sans-serif" font-size="13" fill="#263244">
    <text x="285" y="363" text-anchor="end">numbered lists</text><rect x="300" y="346" width="0.46" height="24" fill="#3b9b6d"/><circle cx="301" cy="358" r="3" fill="#3b9b6d"/><text x="312" y="363">0.076%</text>
    <text x="285" y="401" text-anchor="end">pending brackets</text><rect x="300" y="384" width="14.2" height="24" rx="3" fill="#3b9b6d"/><text x="323" y="401">2.37%</text>
  </g>
  <text x="300" y="438" font-family="sans-serif" font-size="12" fill="#526070">All 32 unrelated prompts remained correct; head activation was nonzero on every prompt.</text>
</svg>
