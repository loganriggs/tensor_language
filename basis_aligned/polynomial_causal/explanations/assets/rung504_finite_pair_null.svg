<svg xmlns="http://www.w3.org/2000/svg" width="940" height="460" viewBox="0 0 940 460" role="img" aria-labelledby="title desc">
  <title id="title">Rung 504 observed maxima versus registered thresholds</title>
  <desc id="desc">Horizontal percentage bars show that local write effects approach one threshold, but actual positive copy-loss effects are far below their thresholds. A final comparison shows MLP8 carries about 26 percent of the local MLP9 response but only about one percent of finite copy benefit.</desc>
  <rect width="940" height="460" fill="#fbfbfc"/>
  <text x="26" y="34" font-family="sans-serif" font-size="20" font-weight="700" fill="#172033">Rung 504: local MLP9 response does not imply causal copy support</text>
  <text x="26" y="58" font-family="sans-serif" font-size="13" fill="#4b5565">Percentages; maxima over all 153 pairs and both backgrounds. Threshold bars are the frozen pass requirements.</text>
  <g font-family="sans-serif" font-size="13" fill="#273244">
    <text x="26" y="105">Pair response cosine</text>
    <text x="26" y="165">Positive local mixed effect</text>
    <text x="26" y="225">Positive joint copy effect</text>
    <text x="26" y="285">Positive mixed copy effect</text>
  </g>
  <g fill="#d7dce5">
    <rect x="270" y="84" width="525" height="18" rx="3"/>
    <rect x="270" y="144" width="70" height="18" rx="3"/>
    <rect x="270" y="204" width="140" height="18" rx="3"/>
    <rect x="270" y="264" width="70" height="18" rx="3"/>
  </g>
  <g fill="#3478bf">
    <rect x="270" y="106" width="351" height="18" rx="3"/>
    <rect x="270" y="166" width="69" height="18" rx="3"/>
    <rect x="270" y="226" width="22" height="18" rx="3"/>
    <rect x="270" y="286" width="17" height="18" rx="3"/>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#4b5565">
    <text x="805" y="98">required 75%</text>
    <text x="350" y="158">required 10%</text>
    <text x="420" y="218">required 20%</text>
    <text x="350" y="278">required 10%</text>
  </g>
  <g font-family="sans-serif" font-size="12" font-weight="700" fill="#24588d">
    <text x="631" y="120">observed 50.1%</text>
    <text x="349" y="180">observed 9.8%</text>
    <text x="302" y="240">observed 3.2%</text>
    <text x="297" y="300">observed 2.4%</text>
  </g>
  <line x1="26" y1="329" x2="914" y2="329" stroke="#d7dce5"/>
  <text x="26" y="359" font-family="sans-serif" font-size="15" font-weight="700" fill="#172033">MLP8 alone, averaged over the two backgrounds</text>
  <text x="26" y="390" font-family="sans-serif" font-size="13" fill="#273244">Fraction of local MLP9 response</text>
  <rect x="270" y="375" width="183" height="18" rx="3" fill="#3478bf"/>
  <text x="463" y="389" font-family="sans-serif" font-size="12" font-weight="700" fill="#24588d">26.1%</text>
  <text x="26" y="426" font-family="sans-serif" font-size="13" fill="#273244">Fraction of actual finite copy benefit</text>
  <rect x="270" y="411" width="7" height="18" rx="3" fill="#d56757"/>
  <text x="287" y="425" font-family="sans-serif" font-size="12" font-weight="700" fill="#9f3d31">1.0%</text>
  <text x="760" y="444" font-family="sans-serif" font-size="11" fill="#6b7280">Scale: 7 px = 1 percentage point</text>
</svg>
