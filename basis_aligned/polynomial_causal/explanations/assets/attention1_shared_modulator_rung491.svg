<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
  <title id="title">Effect of removing attention1's contribution from the MLP1 native-state response</title>
  <desc id="desc">Held-out bar charts show the decrease in effect cosine and increase in adjusted error for token-only and interaction branches in two validation quarters.</desc>
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#111827">Removing the attention1 term materially worsens both T and I</text>
  <rect x="650" y="51" width="14" height="14" fill="#3b82f6"/><text x="670" y="63" font-family="sans-serif" font-size="13" fill="#374151">documents 500–749</text>
  <rect x="650" y="73" width="14" height="14" fill="#f59e0b"/><text x="670" y="85" font-family="sans-serif" font-size="13" fill="#374151">documents 750–999</text>
  <text x="235" y="98" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#111827">Effect-cosine decrease</text>
  <text x="665" y="98" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#111827">Adjusted-error increase</text>
  <g stroke="#d1d5db" stroke-width="1" font-family="sans-serif" font-size="11" fill="#6b7280">
    <line x1="70" y1="400" x2="420" y2="400"/><line x1="490" y1="400" x2="840" y2="400"/>
    <line x1="70" y1="320" x2="420" y2="320"/><line x1="490" y1="320" x2="840" y2="320"/>
    <line x1="70" y1="240" x2="420" y2="240"/><line x1="490" y1="240" x2="840" y2="240"/>
    <line x1="70" y1="160" x2="420" y2="160"/><line x1="490" y1="160" x2="840" y2="160"/>
    <text x="62" y="404" text-anchor="end">0</text><text x="482" y="404" text-anchor="end">0</text>
    <text x="62" y="324" text-anchor="end">5</text><text x="482" y="324" text-anchor="end">10</text>
    <text x="62" y="244" text-anchor="end">10</text><text x="482" y="244" text-anchor="end">20</text>
    <text x="62" y="164" text-anchor="end">15 pp</text><text x="482" y="164" text-anchor="end">30 pp</text>
  </g>
  <g font-family="sans-serif" font-size="12" text-anchor="middle">
    <rect x="115" y="187.9" width="48" height="212.1" fill="#3b82f6"/><text x="139" y="179" fill="#1f2937">13.26</text>
    <rect x="169" y="187.6" width="48" height="212.4" fill="#f59e0b"/><text x="193" y="204" fill="#ffffff">13.28</text>
    <rect x="275" y="232.1" width="48" height="167.9" fill="#3b82f6"/><text x="299" y="223" fill="#1f2937">10.49</text>
    <rect x="329" y="228.3" width="48" height="171.7" fill="#f59e0b"/><text x="353" y="245" fill="#ffffff">10.73</text>
    <rect x="535" y="150.8" width="48" height="249.2" fill="#3b82f6"/><text x="559" y="142" fill="#1f2937">31.14</text>
    <rect x="589" y="150.6" width="48" height="249.4" fill="#f59e0b"/><text x="613" y="167" fill="#ffffff">31.17</text>
    <rect x="695" y="169.7" width="48" height="230.3" fill="#3b82f6"/><text x="719" y="161" fill="#1f2937">28.79</text>
    <rect x="749" y="163.2" width="48" height="236.8" fill="#f59e0b"/><text x="773" y="180" fill="#ffffff">29.60</text>
  </g>
  <g font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#374151">
    <text x="166" y="430">Token-only (T)</text><text x="326" y="430">Interaction (I)</text>
    <text x="586" y="430">Token-only (T)</text><text x="746" y="430">Interaction (I)</text>
  </g>
  <text x="450" y="463" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4b5563">pp = percentage points. These bars show degradation caused by leaving out A1, not model accuracy.</text>
</svg>
