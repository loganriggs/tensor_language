<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="title desc">
  <title id="title">Selected attention1 query-side pair fails confirmation</title>
  <desc id="desc">Bar chart comparing selection and confirmation cosine, with residual error shown separately.</desc>
  <rect width="880" height="420" fill="white"/>
  <style>
    text { font-family: sans-serif; fill: #222; }
    .axis { stroke: #555; stroke-width: 1; }
    .grid { stroke: #ddd; stroke-width: 1; }
    .select { fill: #4472c4; }
    .confirm { fill: #d95f5f; }
    .label { font-size: 15px; }
    .small { font-size: 13px; fill: #555; }
  </style>
  <text x="440" y="28" text-anchor="middle" font-size="20" font-weight="bold">Best selected Q2-side pair does not reproduce</text>
  <text x="225" y="60" text-anchor="middle" class="label">Downstream-effect cosine (higher is better)</text>
  <line x1="75" y1="250" x2="375" y2="250" class="axis"/>
  <line x1="75" y1="90" x2="75" y2="282" class="axis"/>
  <line x1="75" y1="130" x2="375" y2="130" class="grid"/>
  <line x1="75" y1="190" x2="375" y2="190" class="grid"/>
  <text x="65" y="254" text-anchor="end" class="small">0</text>
  <text x="65" y="194" text-anchor="end" class="small">0.25</text>
  <text x="65" y="134" text-anchor="end" class="small">0.50</text>
  <rect x="125" y="117" width="72" height="133" class="select"/>
  <rect x="255" y="250" width="72" height="9" class="confirm"/>
  <text x="161" y="108" text-anchor="middle" class="label">55.3%</text>
  <text x="291" y="278" text-anchor="middle" class="label">−3.9%</text>
  <text x="161" y="302" text-anchor="middle" class="small">selection docs</text>
  <text x="291" y="302" text-anchor="middle" class="small">confirmation docs</text>
  <text x="655" y="60" text-anchor="middle" class="label">Unexplained effect after rescaling (lower is better)</text>
  <line x1="505" y1="250" x2="805" y2="250" class="axis"/>
  <line x1="505" y1="90" x2="505" y2="250" class="axis"/>
  <line x1="505" y1="170" x2="805" y2="170" class="grid"/>
  <line x1="505" y1="90" x2="805" y2="90" class="grid"/>
  <text x="495" y="254" text-anchor="end" class="small">0%</text>
  <text x="495" y="174" text-anchor="end" class="small">50%</text>
  <text x="495" y="94" text-anchor="end" class="small">100%</text>
  <rect x="555" y="117" width="72" height="133" class="select"/>
  <rect x="685" y="90" width="72" height="160" class="confirm"/>
  <text x="591" y="108" text-anchor="middle" class="label">83.3%</text>
  <text x="721" y="81" text-anchor="middle" class="label">99.9%</text>
  <text x="591" y="302" text-anchor="middle" class="small">selection docs</text>
  <text x="721" y="302" text-anchor="middle" class="small">confirmation docs</text>
  <rect x="290" y="350" width="18" height="18" class="select"/><text x="318" y="364" class="small">used to choose pair</text>
  <rect x="500" y="350" width="18" height="18" class="confirm"/><text x="528" y="364" class="small">never used to choose pair</text>
  <text x="440" y="398" text-anchor="middle" class="small">Pair: head 0 Q2 side / head 2 Q2 side; no validation data opened</text>
</svg>
