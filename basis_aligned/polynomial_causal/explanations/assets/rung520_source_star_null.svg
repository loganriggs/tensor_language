<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="510" viewBox="0 0 1040 510" role="img" aria-labelledby="title desc">
  <title id="title">Rung 520 source-star screening and interaction non-additivity</title>
  <desc id="desc">Left panel: 88.9 percent of pairs have two material nodes, 35.3 percent also admit a scale, 0.052 percent pass both task halves, and zero pass either complete circuit half. Right panel: the median error from predicting a joint source-star removal by adding its 22 singleton removals is 851 percent for task effects and 968 percent for circuit effects.</desc>
  <rect width="1040" height="510" fill="#fbfaf7"/>
  <style>
    .title{font:700 22px system-ui,sans-serif;fill:#17202a}.sub{font:600 16px system-ui,sans-serif;fill:#34495e}
    .lab{font:14px system-ui,sans-serif;fill:#263238}.small{font:12px system-ui,sans-serif;fill:#546e7a}
    .val{font:700 14px system-ui,sans-serif;fill:#17202a}.grid{stroke:#d7dbdd;stroke-width:1}.axis{stroke:#7f8c8d;stroke-width:1.5}
  </style>
  <text x="32" y="36" class="title">Rung 520: source stars are active, but not reusable circuit units</text>
  <text x="32" y="72" class="sub">Pair-screen funnel (% of all 3,828 pairs)</text>
  <line x1="224" y1="94" x2="224" y2="314" class="axis"/>
  <line x1="224" y1="314" x2="596" y2="314" class="axis"/>
  <line x1="224" y1="259" x2="596" y2="259" class="grid"/><line x1="224" y1="204" x2="596" y2="204" class="grid"/>
  <line x1="224" y1="149" x2="596" y2="149" class="grid"/><line x1="224" y1="94" x2="596" y2="94" class="grid"/>
  <text x="190" y="318" class="small">0%</text><text x="181" y="263" class="small">25%</text><text x="181" y="208" class="small">50%</text>
  <text x="181" y="153" class="small">75%</text><text x="174" y="98" class="small">100%</text>
  <text x="32" y="124" class="lab">Both nodes measurable</text><rect x="224" y="106" width="331" height="28" rx="4" fill="#4c78a8"/><text x="563" y="125" class="val">88.9%</text>
  <text x="32" y="174" class="lab">Also permits one scale</text><rect x="224" y="156" width="131" height="28" rx="4" fill="#72a0c1"/><text x="363" y="175" class="val">35.3%</text>
  <text x="32" y="224" class="lab">Passes both task halves</text><rect x="224" y="206" width="2" height="28" fill="#f28e2b"/><text x="234" y="225" class="val">0.052% (2 pairs)</text>
  <text x="32" y="274" class="lab">Passes circuit half 0</text><rect x="224" y="256" width="1" height="28" fill="#e15759"/><text x="234" y="275" class="val">0%</text>
  <text x="32" y="324" class="lab">Passes full rule</text><rect x="224" y="306" width="1" height="8" fill="#b03a2e"/><text x="234" y="326" class="val">0%</text>

  <text x="646" y="72" class="sub">Joint removal cannot be predicted by addition</text>
  <line x1="702" y1="94" x2="702" y2="314" class="axis"/><line x1="702" y1="314" x2="1008" y2="314" class="axis"/>
  <line x1="702" y1="259" x2="1008" y2="259" class="grid"/><line x1="702" y1="204" x2="1008" y2="204" class="grid"/>
  <line x1="702" y1="149" x2="1008" y2="149" class="grid"/><line x1="702" y1="94" x2="1008" y2="94" class="grid"/>
  <text x="663" y="318" class="small">0%</text><text x="649" y="263" class="small">250%</text><text x="649" y="208" class="small">500%</text>
  <text x="649" y="153" class="small">750%</text><text x="642" y="98" class="small">1000%</text>
  <rect x="754" y="127" width="78" height="187" rx="4" fill="#59a14f"/><text x="772" y="119" class="val">851%</text><text x="757" y="338" class="lab">Tasks</text>
  <rect x="881" y="101" width="78" height="213" rx="4" fill="#b07aa1"/><text x="899" y="93" class="val">968%</text><text x="882" y="338" class="lab">Circuits</text>
  <text x="646" y="374" class="small">Relative error = ||joint effect − sum of singleton effects|| / ||joint effect||.</text>
  <text x="646" y="395" class="small">Values are medians over 88 action-by-source stars.</text>

  <rect x="32" y="420" width="976" height="62" rx="7" fill="#eef3f7"/>
  <text x="50" y="445" class="lab">Interpretation: source stars produce real causal changes and sometimes share the same coarse task direction,</text>
  <text x="50" y="468" class="lab">but known circuits distinguish them. The large nonlinear interaction rules out adding singleton effects.</text>
</svg>
