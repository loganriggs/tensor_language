<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">Task 14 subject–verb agreement causal screen</title>
  <desc id="desc">Residual-stream recovery rises sharply between block boundaries 11 and 12. Attention 11 and head 11.3 each recover about sixty percent of the donor effect while controls remain below four percent.</desc>
  <rect width="1100" height="720" fill="#fbfaf7"/>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #20242a; }
    .title { font-size: 25px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #59636e; }
    .axis { stroke: #8b949e; stroke-width: 1; }
    .grid { stroke: #d8dde3; stroke-width: 1; stroke-dasharray: 4 5; }
    .tick { font-size: 12px; fill: #59636e; }
    .label { font-size: 14px; font-weight: 600; }
    .note { font-size: 13px; fill: #424b55; }
  </style>

  <text x="55" y="42" class="title">Where the agreement signal becomes causally usable</text>
  <text x="55" y="67" class="subtitle">Recovery is the percentage of the native donor-induced `is`/`are` logit-margin shift reproduced by a state swap.</text>

  <!-- residual panel -->
  <text x="55" y="105" class="label">Residual-stream boundary sweep</text>
  <line x1="75" y1="390" x2="965" y2="390" class="axis"/>
  <line x1="75" y1="130" x2="75" y2="390" class="axis"/>
  <line x1="75" y1="260" x2="965" y2="260" class="grid"/>
  <line x1="75" y1="130" x2="965" y2="130" class="grid"/>
  <text x="42" y="394" class="tick">0%</text>
  <text x="34" y="264" class="tick">50%</text>
  <text x="26" y="134" class="tick">100%</text>
  <text x="975" y="264" class="tick">screen threshold</text>

  <polyline fill="none" stroke="#3066be" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"
    points="75,390 124,390.2 174,390.6 223,390.7 273,390.5 322,388.9 372,378 421,377.7 471,352.1 520,349.5 570,312.7 619,304.1 669,146.4 718,144.8 768,138.6 817,137.5 867,133.3 916,130.7 965,130"/>

  <g fill="#3066be">
    <circle cx="75" cy="390" r="4"/><circle cx="124" cy="390.2" r="4"/><circle cx="174" cy="390.6" r="4"/>
    <circle cx="223" cy="390.7" r="4"/><circle cx="273" cy="390.5" r="4"/><circle cx="322" cy="388.9" r="4"/>
    <circle cx="372" cy="378" r="4"/><circle cx="421" cy="377.7" r="4"/><circle cx="471" cy="352.1" r="4"/>
    <circle cx="520" cy="349.5" r="4"/><circle cx="570" cy="312.7" r="4"/><circle cx="619" cy="304.1" r="5"/>
    <circle cx="669" cy="146.4" r="7" fill="#d97706"/><circle cx="718" cy="144.8" r="4"/><circle cx="768" cy="138.6" r="4"/>
    <circle cx="817" cy="137.5" r="4"/><circle cx="867" cy="133.3" r="4"/><circle cx="916" cy="130.7" r="4"/><circle cx="965" cy="130" r="4"/>
  </g>

  <g class="tick" text-anchor="middle">
    <text x="75" y="412">0</text><text x="174" y="412">2</text><text x="273" y="412">4</text><text x="372" y="412">6</text>
    <text x="471" y="412">8</text><text x="570" y="412">10</text><text x="669" y="412">12</text><text x="768" y="412">14</text>
    <text x="867" y="412">16</text><text x="965" y="412">18</text>
  </g>
  <text x="520" y="438" class="tick" text-anchor="middle">residual boundary (0 = embedding; 12 = after block 11)</text>
  <line x1="650" y1="180" x2="667" y2="151" stroke="#d97706" stroke-width="2"/>
  <rect x="490" y="158" width="165" height="51" rx="8" fill="#fff4de" stroke="#d97706"/>
  <text x="504" y="179" class="label" fill="#8a4b00">Earliest pass: boundary 12</text>
  <text x="504" y="198" class="note">93.7% recovery</text>

  <!-- component panel -->
  <text x="55" y="490" class="label">Block-11 localization and controls</text>
  <text x="55" y="512" class="subtitle">Blue/orange: target recovery. Gray: answer-preserving control movement. Dashed line: 50% target bar.</text>
  <line x1="250" y1="665" x2="1000" y2="665" class="axis"/>
  <line x1="625" y1="530" x2="625" y2="665" class="grid"/>
  <text x="625" y="686" class="tick" text-anchor="middle">50%</text>
  <text x="1000" y="686" class="tick" text-anchor="middle">100%</text>

  <g class="label" text-anchor="end">
    <text x="235" y="548">attention 11</text>
    <text x="235" y="580">head 11.3</text>
    <text x="235" y="612">MLP 11</text>
    <text x="235" y="644">MLP 12</text>
  </g>
  <rect x="250" y="532" width="459.5" height="20" rx="4" fill="#3066be"/>
  <rect x="250" y="564" width="452.7" height="20" rx="4" fill="#d97706"/>
  <rect x="250" y="596" width="47.9" height="20" rx="4" fill="#6b8e9b"/>
  <rect x="250" y="628" width="119.3" height="20" rx="4" fill="#6b8e9b"/>

  <rect x="250" y="552" width="24.9" height="6" fill="#a8afb7"/>
  <rect x="250" y="558" width="26.7" height="6" fill="#d3b37a"/>
  <rect x="250" y="584" width="22.7" height="6" fill="#a8afb7"/>
  <rect x="250" y="590" width="29.5" height="6" fill="#d3b37a"/>

  <g class="note">
    <text x="718" y="548">61.3%</text>
    <text x="711" y="580">60.4% — 98.5% of the whole attention effect</text>
    <text x="306" y="612">6.4%</text>
    <text x="378" y="644">15.9%</text>
    <text x="812" y="625">head 11.3 controls: noun identity 3.0%; attractor-number edit 3.9%</text>
  </g>

  <rect x="55" y="686" width="990" height="25" rx="6" fill="#f2eee6"/>
  <text x="68" y="704" class="note">Interpretation: strong `is`/`are` causal handle, not yet a syntax-general grammatical-number variable; literal PP↔relative interchange is next.</text>
</svg>
