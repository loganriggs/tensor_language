<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Rung 521: stable attention8 effect, insufficient circuit selectivity</title>
  <desc id="desc">Left panel shows average member-to-control concentration for three circuits and two swap directions as a percentage of the frozen three-times threshold. Right panel compares cross-half circuit-fingerprint correlations with permutation-null 95th percentiles.</desc>
  <rect width="1000" height="560" fill="#fbfaf7"/>
  <text x="500" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#202124">Rung 521: attention8 is reproducible, but too broad</text>

  <text x="260" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#30343b">Target selectivity</text>
  <text x="260" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#5f6368">average concentration as % of frozen 3× requirement</text>
  <line x1="75" y1="410" x2="470" y2="410" stroke="#70757a" stroke-width="1"/>
  <line x1="75" y1="110" x2="75" y2="410" stroke="#70757a" stroke-width="1"/>
  <line x1="75" y1="110" x2="470" y2="110" stroke="#c62828" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="466" y="104" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#c62828">required 100%</text>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#5f6368">
    <text x="67" y="414" text-anchor="end">0%</text>
    <text x="67" y="339" text-anchor="end">25%</text>
    <text x="67" y="264" text-anchor="end">50%</text>
    <text x="67" y="189" text-anchor="end">75%</text>
    <text x="67" y="114" text-anchor="end">100%</text>
  </g>
  <g stroke="#dedede" stroke-width="1">
    <line x1="75" y1="335" x2="470" y2="335"/>
    <line x1="75" y1="260" x2="470" y2="260"/>
    <line x1="75" y1="185" x2="470" y2="185"/>
  </g>
  <rect x="105" y="273" width="42" height="137" rx="3" fill="#4c78a8"/>
  <rect x="149" y="275" width="42" height="135" rx="3" fill="#72a0c1"/>
  <rect x="230" y="263" width="42" height="147" rx="3" fill="#4c78a8"/>
  <rect x="274" y="265" width="42" height="145" rx="3" fill="#72a0c1"/>
  <rect x="355" y="251" width="42" height="159" rx="3" fill="#4c78a8"/>
  <rect x="399" y="250" width="42" height="160" rx="3" fill="#72a0c1"/>
  <g font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#202124">
    <text x="126" y="266" text-anchor="middle">45.7%</text>
    <text x="170" y="268" text-anchor="middle">45.1%</text>
    <text x="251" y="256" text-anchor="middle">49.0%</text>
    <text x="295" y="258" text-anchor="middle">48.4%</text>
    <text x="376" y="244" text-anchor="middle">53.1%</text>
    <text x="420" y="243" text-anchor="middle">53.3%</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#30343b">
    <text x="148" y="432" text-anchor="middle">r.2.0.2</text>
    <text x="273" y="432" text-anchor="middle">r.2.1.1</text>
    <text x="398" y="432" text-anchor="middle">r.2.2.1</text>
  </g>
  <rect x="125" y="462" width="14" height="14" fill="#4c78a8"/><text x="145" y="474" font-family="system-ui, sans-serif" font-size="12" fill="#30343b">recipient ← donor</text>
  <rect x="278" y="462" width="14" height="14" fill="#72a0c1"/><text x="298" y="474" font-family="system-ui, sans-serif" font-size="12" fill="#30343b">reverse swap</text>

  <text x="750" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#30343b">32-circuit fingerprint stability</text>
  <text x="750" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#5f6368">cross-document-half Pearson correlation</text>
  <line x1="545" y1="410" x2="955" y2="410" stroke="#70757a" stroke-width="1"/>
  <line x1="545" y1="110" x2="545" y2="410" stroke="#70757a" stroke-width="1"/>
  <g stroke="#dedede" stroke-width="1">
    <line x1="545" y1="335" x2="955" y2="335"/>
    <line x1="545" y1="260" x2="955" y2="260"/>
    <line x1="545" y1="185" x2="955" y2="185"/>
    <line x1="545" y1="110" x2="955" y2="110"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#5f6368">
    <text x="537" y="414" text-anchor="end">0%</text>
    <text x="537" y="339" text-anchor="end">25%</text>
    <text x="537" y="264" text-anchor="end">50%</text>
    <text x="537" y="189" text-anchor="end">75%</text>
    <text x="537" y="114" text-anchor="end">100%</text>
  </g>
  <rect x="579" y="118" width="34" height="292" rx="3" fill="#2a9d8f"/>
  <rect x="615" y="254" width="34" height="156" rx="3" fill="#b8c2cc"/>
  <rect x="672" y="121" width="34" height="289" rx="3" fill="#2a9d8f"/>
  <rect x="708" y="251" width="34" height="159" rx="3" fill="#b8c2cc"/>
  <rect x="765" y="123" width="34" height="287" rx="3" fill="#2a9d8f"/>
  <rect x="801" y="269" width="34" height="141" rx="3" fill="#b8c2cc"/>
  <rect x="858" y="121" width="34" height="289" rx="3" fill="#2a9d8f"/>
  <rect x="894" y="260" width="34" height="150" rx="3" fill="#b8c2cc"/>
  <g font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#202124">
    <text x="596" y="112" text-anchor="middle">97.3%</text><text x="632" y="247" text-anchor="middle">52.1%</text>
    <text x="689" y="115" text-anchor="middle">96.2%</text><text x="725" y="244" text-anchor="middle">52.9%</text>
    <text x="782" y="117" text-anchor="middle">95.8%</text><text x="818" y="262" text-anchor="middle">47.1%</text>
    <text x="875" y="115" text-anchor="middle">96.3%</text><text x="911" y="253" text-anchor="middle">49.9%</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#30343b">
    <text x="614" y="432" text-anchor="middle">forward D0</text>
    <text x="707" y="432" text-anchor="middle">forward D1</text>
    <text x="800" y="432" text-anchor="middle">reverse D0</text>
    <text x="893" y="432" text-anchor="middle">reverse D1</text>
  </g>
  <rect x="650" y="462" width="14" height="14" fill="#2a9d8f"/><text x="670" y="474" font-family="system-ui, sans-serif" font-size="12" fill="#30343b">observed</text>
  <rect x="750" y="462" width="14" height="14" fill="#b8c2cc"/><text x="770" y="474" font-family="system-ui, sans-serif" font-size="12" fill="#30343b">permutation q95</text>

  <text x="500" y="525" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#5f6368">The assay reliably sees attention8, but the complete module is not selective enough to be the proposed circuit unit.</text>
</svg>
