<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Held-out MLP1 native-state response by MLP0 branch</title>
  <desc id="desc">Two bar charts show effect-direction agreement and scale-adjusted remaining error for token-only, interaction, and context-only branches in two held-out document quarters.</desc>
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#111827">MLP1 native-state response on held-out interventions</text>
  <rect x="650" y="51" width="14" height="14" fill="#3b82f6"/><text x="670" y="63" font-family="sans-serif" font-size="13" fill="#374151">documents 500–749</text>
  <rect x="650" y="73" width="14" height="14" fill="#f59e0b"/><text x="670" y="85" font-family="sans-serif" font-size="13" fill="#374151">documents 750–999</text>

  <text x="235" y="94" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#111827">Effect-direction agreement (higher is better)</text>
  <text x="665" y="94" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#111827">Remaining error after rescaling (lower is better)</text>

  <g stroke="#d1d5db" stroke-width="1" font-family="sans-serif" font-size="11" fill="#6b7280">
    <line x1="65" y1="420" x2="425" y2="420"/><line x1="490" y1="420" x2="850" y2="420"/>
    <line x1="65" y1="350" x2="425" y2="350"/><line x1="490" y1="350" x2="850" y2="350"/>
    <line x1="65" y1="280" x2="425" y2="280"/><line x1="490" y1="280" x2="850" y2="280"/>
    <line x1="65" y1="210" x2="425" y2="210"/><line x1="490" y1="210" x2="850" y2="210"/>
    <line x1="65" y1="140" x2="425" y2="140"/><line x1="490" y1="140" x2="850" y2="140"/>
    <text x="56" y="424" text-anchor="end">0%</text><text x="481" y="424" text-anchor="end">0%</text>
    <text x="56" y="354" text-anchor="end">25%</text><text x="481" y="354" text-anchor="end">25%</text>
    <text x="56" y="284" text-anchor="end">50%</text><text x="481" y="284" text-anchor="end">50%</text>
    <text x="56" y="214" text-anchor="end">75%</text><text x="481" y="214" text-anchor="end">75%</text>
    <text x="56" y="144" text-anchor="end">100%</text><text x="481" y="144" text-anchor="end">100%</text>
  </g>

  <g font-family="sans-serif" font-size="11" text-anchor="middle">
    <rect x="95" y="147.5" width="34" height="272.5" fill="#3b82f6"/><text x="112" y="139" fill="#1f2937">97.3%</text>
    <rect x="133" y="147.5" width="34" height="272.5" fill="#f59e0b"/><text x="150" y="158" fill="#ffffff">97.3%</text>
    <rect x="207" y="145.3" width="34" height="274.7" fill="#3b82f6"/><text x="224" y="137" fill="#1f2937">98.1%</text>
    <rect x="245" y="145.0" width="34" height="275.0" fill="#f59e0b"/><text x="262" y="156" fill="#ffffff">98.2%</text>
    <rect x="319" y="173.3" width="34" height="246.7" fill="#3b82f6"/><text x="336" y="165" fill="#1f2937">88.1%</text>
    <rect x="357" y="185.5" width="34" height="234.5" fill="#f59e0b"/><text x="374" y="197" fill="#ffffff">83.7%</text>

    <rect x="520" y="355.6" width="34" height="64.4" fill="#3b82f6"/><text x="537" y="347" fill="#1f2937">23.0%</text>
    <rect x="558" y="355.5" width="34" height="64.5" fill="#f59e0b"/><text x="575" y="367" fill="#ffffff">23.0%</text>
    <rect x="632" y="365.5" width="34" height="54.5" fill="#3b82f6"/><text x="649" y="357" fill="#1f2937">19.5%</text>
    <rect x="670" y="367.2" width="34" height="52.8" fill="#f59e0b"/><text x="687" y="379" fill="#ffffff">18.9%</text>
    <rect x="744" y="287.6" width="34" height="132.4" fill="#3b82f6"/><text x="761" y="279" fill="#1f2937">47.3%</text>
    <rect x="782" y="266.9" width="34" height="153.1" fill="#f59e0b"/><text x="799" y="279" fill="#ffffff">54.7%</text>
  </g>

  <g font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#374151">
    <text x="131" y="447">Token-only (T)</text><text x="243" y="447">Interaction (I)</text><text x="355" y="447">Context-only (C)</text>
    <text x="556" y="447">Token-only (T)</text><text x="668" y="447">Interaction (I)</text><text x="780" y="447">Context-only (C)</text>
  </g>
  <text x="450" y="482" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4b5563">Agreement is cosine × 100. Error is the remaining RMS mismatch after choosing the best single scale, × 100.</text>
</svg>
