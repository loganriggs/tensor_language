<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc">
  <title id="title">Task 14 cross-syntax transfer and block 11 component recovery</title>
  <desc id="desc">Two bar charts. The left compares complete attention 11 and head 11.3 across four literal cross-syntax subject-number transfers. The right shows donor recovery from fixed block 11 components.</desc>
