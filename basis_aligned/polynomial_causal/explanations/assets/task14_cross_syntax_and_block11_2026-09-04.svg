  <rect x="610" y="382" width="466" height="76" rx="8" fill="#eef5f1" stroke="#c7dfd1"/>
  <text x="626" y="406" font-family="system-ui, sans-serif" font-size="13" fill="#254c39">Interaction corrections are small:</text>
  <text x="626" y="429" font-family="ui-monospace, monospace" font-size="13" fill="#254c39">R×A +1.1%   R×M +1.1%   A×M +0.9%</text>
  <text x="626" y="450" font-family="ui-monospace, monospace" font-size="13" fill="#254c39">R×A×M −2.1%</text>

  <text x="560" y="502" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#39465b">Recovery is the fraction of the native recipient→donor answer-margin change reproduced by the patch.</text>
