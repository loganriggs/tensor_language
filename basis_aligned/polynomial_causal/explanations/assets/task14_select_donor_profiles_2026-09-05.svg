<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Task14 held-out donor recovery by donor matching rule</title>
  <desc id="desc">Grouped bars compare matched-noun and cross-noun donor recovery for attention block 11 and head 11.3.</desc>
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="380" y="27" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold">Held-out subject-number transfer is stable across donor rules</text>
  <line x1="110" y1="240" x2="720" y2="240" stroke="#333" stroke-width="1.5"/>
  <line x1="110" y1="55" x2="110" y2="240" stroke="#333" stroke-width="1.5"/>
  <g font-family="sans-serif" font-size="12" fill="#333">
    <text x="100" y="244" text-anchor="end">0%</text>
    <text x="100" y="191" text-anchor="end">20%</text>
    <text x="100" y="138" text-anchor="end">40%</text>
    <text x="100" y="85" text-anchor="end">60%</text>
    <text x="260" y="263" text-anchor="middle">attention block 11</text>
    <text x="555" y="263" text-anchor="middle">head 11.3 only</text>
  </g>
  <g stroke="#e4e4e4" stroke-width="1">
    <line x1="110" y1="187" x2="720" y2="187"/>
    <line x1="110" y1="134" x2="720" y2="134"/>
    <line x1="110" y1="81" x2="720" y2="81"/>
  </g>
  <rect x="190" y="71.6" width="62" height="168.4" fill="#4c78a8"/>
  <rect x="264" y="70.9" width="62" height="169.1" fill="#f58518"/>
  <rect x="485" y="73.8" width="62" height="166.2" fill="#4c78a8"/>
  <rect x="559" y="73.3" width="62" height="166.7" fill="#f58518"/>
  <g font-family="sans-serif" font-size="12" font-weight="bold" fill="#222">
    <text x="221" y="65" text-anchor="middle">63.54%</text>
    <text x="295" y="64" text-anchor="middle">63.81%</text>
    <text x="516" y="67" text-anchor="middle">62.73%</text>
    <text x="590" y="67" text-anchor="middle">62.89%</text>
  </g>
  <g font-family="sans-serif" font-size="12">
    <rect x="225" y="278" width="14" height="14" fill="#4c78a8"/>
    <text x="245" y="290">matched noun</text>
    <rect x="410" y="278" width="14" height="14" fill="#f58518"/>
    <text x="430" y="290">different noun</text>
  </g>
</svg>
