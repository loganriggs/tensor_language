<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Rung 534 shared-signal and private-remainder results</title>
  <desc id="desc">Horizontal percentage bars. Shared premise 100 percent, code matched-negative autonomy 100 percent, code copy-positive autonomy zero percent, key and sign control separation 100 percent, natural donor-absent autonomy zero percent, donor-present complete autonomy 25 percent.</desc>
  <rect width="980" height="430" fill="#fff"/>
  <text x="28" y="34" font-family="sans-serif" font-size="22" font-weight="700" fill="#18212f">Rung 534: which parts of the shared/private split survived?</text>
  <text x="28" y="58" font-family="sans-serif" font-size="14" fill="#465366">Percent of preregistered halves or contexts passing each named check</text>
  <g font-family="sans-serif" font-size="14" fill="#253143">
    <text x="28" y="105">Shared-signal premise, code/source absent</text>
    <text x="28" y="158">R predicts false-match marginal, code/source absent</text>
    <text x="28" y="211">R predicts copy marginal, code/source absent</text>
    <text x="28" y="264">R beats key/sign controls, code/source absent</text>
    <text x="28" y="317">Complete autonomy, natural/source absent</text>
    <text x="28" y="370">Complete autonomy, source present</text>
  </g>
  <g fill="#e6eaf0">
    <rect x="430" y="84" width="460" height="28" rx="4"/>
    <rect x="430" y="137" width="460" height="28" rx="4"/>
    <rect x="430" y="190" width="460" height="28" rx="4"/>
    <rect x="430" y="243" width="460" height="28" rx="4"/>
    <rect x="430" y="296" width="460" height="28" rx="4"/>
