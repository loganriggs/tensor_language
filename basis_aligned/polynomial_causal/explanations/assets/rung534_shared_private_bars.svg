    <rect x="430" y="137" width="460" height="28" rx="4" fill="#2f7d63"/>
    <rect x="430" y="190" width="2" height="28" rx="1" fill="#b94a48"/>
    <rect x="430" y="243" width="460" height="28" rx="4" fill="#2f7d63"/>
    <rect x="430" y="296" width="2" height="28" rx="1" fill="#b94a48"/>
    <rect x="430" y="349" width="115" height="28" rx="4" fill="#c08a24"/>
