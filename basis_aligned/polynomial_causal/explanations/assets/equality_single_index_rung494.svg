<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700" role="img" aria-labelledby="title desc">
  <title id="title">Rung494 nonlinear-readout prediction error relative to ordinary addition</title>
  <desc id="desc">At half strength all six prediction error ratios are approximately one hundred percent or worse. At one and a half strength all six are lower, although some fitted inputs are out of range.</desc>
  <rect width="1040" height="590" fill="#ffffff"/>
  <text x="520" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#17212b">Nonlinear readout error as a percentage of ordinary-addition error</text>
  <text x="520" y="59" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#52606d">Lower is better; the dashed 100% line means no improvement over addition</text>

  <line x1="230" y1="86" x2="230" y2="623" stroke="#9aa5b1"/>
  <line x1="230" y1="623" x2="950" y2="623" stroke="#9aa5b1"/>
  <line x1="806" y1="82" x2="806" y2="623" stroke="#b42318" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="806" y="643" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b42318">100%</text>
  <text x="230" y="643" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#52606d">0%</text>
  <text x="518" y="643" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#52606d">50%</text>
  <text x="950" y="643" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#52606d">125%</text>

  <text x="24" y="110" font-family="sans-serif" font-size="16" font-weight="700" fill="#17212b">Half strength</text>
  <text x="24" y="133" font-family="sans-serif" font-size="12" fill="#52606d">all inputs inside fitted range</text>
  <text x="24" y="166" font-family="sans-serif" font-size="13" fill="#344054">code · N</text>
  <rect x="230" y="151" width="614" height="19" rx="3" fill="#d92d20"/><text x="852" y="166" font-family="sans-serif" font-size="13" fill="#344054">106.6%</text>
  <text x="24" y="196" font-family="sans-serif" font-size="13" fill="#344054">code · H</text>
  <rect x="230" y="181" width="639" height="19" rx="3" fill="#d92d20"/><text x="877" y="196" font-family="sans-serif" font-size="13" fill="#344054">110.9%</text>
  <text x="24" y="226" font-family="sans-serif" font-size="13" fill="#344054">natural 0 · N</text>
  <rect x="230" y="211" width="702" height="19" rx="3" fill="#d92d20"/><text x="940" y="226" font-family="sans-serif" font-size="13" fill="#344054">121.9%</text>
  <text x="24" y="256" font-family="sans-serif" font-size="13" fill="#344054">natural 0 · H</text>
  <rect x="230" y="241" width="577" height="19" rx="3" fill="#f97066"/><text x="815" y="256" font-family="sans-serif" font-size="13" fill="#344054">100.2%</text>
  <text x="24" y="286" font-family="sans-serif" font-size="13" fill="#344054">natural 1 · N</text>
  <rect x="230" y="271" width="625" height="19" rx="3" fill="#d92d20"/><text x="863" y="286" font-family="sans-serif" font-size="13" fill="#344054">108.5%</text>
  <text x="24" y="316" font-family="sans-serif" font-size="13" fill="#344054">natural 1 · H</text>
  <rect x="230" y="301" width="574" height="19" rx="3" fill="#f97066"/><text x="812" y="316" font-family="sans-serif" font-size="13" fill="#344054">99.6%</text>

  <text x="24" y="363" font-family="sans-serif" font-size="16" font-weight="700" fill="#17212b">1.5× strength</text>
  <text x="24" y="386" font-family="sans-serif" font-size="12" fill="#52606d">62.8–76.0% of inputs inside fitted range</text>
  <text x="24" y="419" font-family="sans-serif" font-size="13" fill="#344054">code · N</text>
  <rect x="230" y="404" width="437" height="19" rx="3" fill="#12b76a"/><text x="675" y="419" font-family="sans-serif" font-size="13" fill="#344054">75.8%</text>
  <text x="24" y="449" font-family="sans-serif" font-size="13" fill="#344054">code · H</text>
  <rect x="230" y="434" width="457" height="19" rx="3" fill="#12b76a"/><text x="695" y="449" font-family="sans-serif" font-size="13" fill="#344054">79.3%</text>
  <text x="24" y="479" font-family="sans-serif" font-size="13" fill="#344054">natural 0 · N</text>
  <rect x="230" y="464" width="365" height="19" rx="3" fill="#12b76a"/><text x="603" y="479" font-family="sans-serif" font-size="13" fill="#344054">63.4%</text>
  <text x="24" y="509" font-family="sans-serif" font-size="13" fill="#344054">natural 0 · H</text>
  <rect x="230" y="494" width="323" height="19" rx="3" fill="#12b76a"/><text x="561" y="509" font-family="sans-serif" font-size="13" fill="#344054">56.1%</text>
  <text x="24" y="539" font-family="sans-serif" font-size="13" fill="#344054">natural 1 · N</text>
  <rect x="230" y="524" width="477" height="19" rx="3" fill="#12b76a"/><text x="715" y="539" font-family="sans-serif" font-size="13" fill="#344054">82.8%</text>
  <text x="24" y="569" font-family="sans-serif" font-size="13" fill="#344054">natural 1 · H</text>
  <rect x="230" y="554" width="383" height="19" rx="3" fill="#12b76a"/><text x="621" y="569" font-family="sans-serif" font-size="13" fill="#344054">66.6%</text>

  <rect x="24" y="674" width="14" height="14" rx="2" fill="#d92d20"/><text x="45" y="686" font-family="sans-serif" font-size="12" fill="#344054">worse/equal to addition at 0.5×</text>
  <rect x="310" y="674" width="14" height="14" rx="2" fill="#12b76a"/><text x="331" y="686" font-family="sans-serif" font-size="12" fill="#344054">better at 1.5×, but partly extrapolative</text>
</svg>
