<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Task 14: causal effect of the eight-head complement and its interaction with head 11.3</title>
  <desc id="desc">Four pairs of percentage bars. The complement ranges from 0.64 to 1.79 percent recovery and the interaction ranges from minus 1.07 to plus 0.63 percent, far below the preregistered 10 percent clean-split threshold.</desc>
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700">Attention 11: all heads except 11.3 contribute very little</text>
  <text x="480" y="56" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#444">Donor-effect recovery (%); clean-split threshold was ±10% for every cell</text>
  <line x1="110" y1="215" x2="910" y2="215" stroke="#222" stroke-width="1.5"/>
  <line x1="110" y1="90" x2="110" y2="340" stroke="#222" stroke-width="1.5"/>
  <g font-family="sans-serif" font-size="12" fill="#444" text-anchor="end">
    <text x="100" y="95">+2%</text><text x="100" y="158">+1%</text><text x="100" y="220">0%</text><text x="100" y="283">−1%</text><text x="100" y="345">−2%</text>
  </g>
  <g stroke="#ddd" stroke-width="1">
    <line x1="110" y1="90" x2="910" y2="90"/><line x1="110" y1="152.5" x2="910" y2="152.5"/><line x1="110" y1="277.5" x2="910" y2="277.5"/><line x1="110" y1="340" x2="910" y2="340"/>
  </g>
  <g fill="#4c78a8">
    <rect x="160" y="173.5" width="44" height="41.5"/><rect x="350" y="155.2" width="44" height="59.8"/><rect x="540" y="174.8" width="44" height="40.2"/><rect x="730" y="103.1" width="44" height="111.9"/>
  </g>
  <g fill="#f28e2b">
    <rect x="210" y="197.8" width="44" height="17.2"/><rect x="400" y="215" width="44" height="18.1"/><rect x="590" y="175.9" width="44" height="39.1"/><rect x="780" y="215" width="44" height="66.7"/>
  </g>
  <g font-family="sans-serif" font-size="12" text-anchor="middle">
    <text x="182" y="166">+0.66%</text><text x="232" y="191">+0.27%</text>
    <text x="372" y="148">+0.96%</text><text x="422" y="248">−0.29%</text>
    <text x="562" y="168">+0.64%</text><text x="612" y="169">+0.63%</text>
    <text x="752" y="97">+1.79%</text><text x="802" y="297">−1.07%</text>
  </g>
  <g font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222">
    <text x="207" y="365">PP: plural→singular</text><text x="397" y="365">PP: singular→plural</text><text x="587" y="365">RC: plural→singular</text><text x="777" y="365">RC: singular→plural</text>
  </g>
  <rect x="250" y="390" width="18" height="12" fill="#4c78a8"/><text x="275" y="401" font-family="sans-serif" font-size="12">eight-head complement</text>
  <rect x="485" y="390" width="18" height="12" fill="#f28e2b"/><text x="510" y="401" font-family="sans-serif" font-size="12">interaction with head 11.3</text>
</svg>
