<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">Fraction of each branch-pair effect difference removed by equalizing attention1 or MLP1 writes</title>
  <desc id="desc">Across all six pairs, equalizing MLP1 writes removes 85 to 95 percent of the original final-loss contrast, while equalizing attention1 writes followed by MLP1 recomputation removes 27 to 41 percent. T and I are not special.</desc>
  <rect width="940" height="500" fill="#ffffff"/>
  <text x="470" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#111827">MLP1 equalization removes nearly every branch distinction, not specifically T versus I</text>
  <rect x="628" y="52" width="14" height="14" fill="#3b82f6"/><text x="650" y="64" font-family="sans-serif" font-size="13" fill="#374151">equalize attention1, recompute MLP1</text>
  <rect x="628" y="75" width="14" height="14" fill="#f59e0b"/><text x="650" y="87" font-family="sans-serif" font-size="13" fill="#374151">equalize MLP1 output</text>
  <g stroke="#d1d5db" stroke-width="1" font-family="sans-serif" font-size="12" fill="#6b7280">
    <line x1="70" y1="410" x2="900" y2="410"/><line x1="70" y1="350" x2="900" y2="350"/>
    <line x1="70" y1="290" x2="900" y2="290"/><line x1="70" y1="230" x2="900" y2="230"/>
    <line x1="70" y1="170" x2="900" y2="170"/><line x1="70" y1="110" x2="900" y2="110"/>
    <text x="62" y="414" text-anchor="end">0%</text><text x="62" y="354" text-anchor="end">20%</text>
    <text x="62" y="294" text-anchor="end">40%</text><text x="62" y="234" text-anchor="end">60%</text>
    <text x="62" y="174" text-anchor="end">80%</text><text x="62" y="114" text-anchor="end">100%</text>
  </g>
  <g font-family="sans-serif" font-size="11" text-anchor="middle">
    <rect x="104" y="311.9" width="42" height="98.1" fill="#3b82f6"/><text x="125" y="304" fill="#1f2937">32.7%</text>
    <rect x="150" y="139.9" width="42" height="270.1" fill="#f59e0b"/><text x="171" y="157" fill="#ffffff">90.0%</text>
    <rect x="238" y="329.1" width="42" height="80.9" fill="#3b82f6"/><text x="259" y="321" fill="#1f2937">27.0%</text>
    <rect x="284" y="156.2" width="42" height="253.8" fill="#f59e0b"/><text x="305" y="173" fill="#ffffff">84.6%</text>
    <rect x="372" y="306.7" width="42" height="103.3" fill="#3b82f6"/><text x="393" y="299" fill="#1f2937">34.4%</text>
    <rect x="418" y="137.3" width="42" height="272.7" fill="#f59e0b"/><text x="439" y="154" fill="#ffffff">90.9%</text>
    <rect x="506" y="286.7" width="42" height="123.3" fill="#3b82f6"/><text x="527" y="279" fill="#1f2937">41.1%</text>
    <rect x="552" y="141.3" width="42" height="268.7" fill="#f59e0b"/><text x="573" y="158" fill="#ffffff">89.6%</text>
    <rect x="640" y="302.6" width="42" height="107.4" fill="#3b82f6"/><text x="661" y="295" fill="#1f2937">35.8%</text>
    <rect x="686" y="126.0" width="42" height="284.0" fill="#f59e0b"/><text x="707" y="143" fill="#ffffff">94.7%</text>
    <rect x="774" y="309.0" width="42" height="101.0" fill="#3b82f6"/><text x="795" y="301" fill="#1f2937">33.7%</text>
    <rect x="820" y="132.7" width="42" height="277.3" fill="#f59e0b"/><text x="841" y="150" fill="#ffffff">92.4%</text>
  </g>
  <g font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#374151">
    <text x="148" y="440">T / C</text><text x="282" y="440">T / I</text><text x="416" y="440">T / S</text>
    <text x="550" y="440">C / I</text><text x="684" y="440">C / S</text><text x="818" y="440">I / S</text>
  </g>
  <text x="470" y="474" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4b5563">Bars average the two fixed 250-document halves. “Removed” means aligned with the original per-token CE-effect difference.</text>
</svg>
