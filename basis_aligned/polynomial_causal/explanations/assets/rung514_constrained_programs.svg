<svg xmlns="http://www.w3.org/2000/svg" width="940" height="510" viewBox="0 0 940 510" role="img" aria-labelledby="title desc">
  <title id="title">Rung514 constrained multi-term program result</title>
  <desc id="desc">The planted recovery and source relation checks passed, but no real fixed or sparse program passed either independent document search.</desc>
  <rect width="940" height="510" fill="#fbfaf7"/>
  <text x="36" y="42" font-family="sans-serif" font-size="25" font-weight="700" fill="#17212b">Constrained multi-term consumer programs</text>
