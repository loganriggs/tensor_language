  <g font-family="sans-serif" font-size="16" fill="#17212b">
    <text x="36" y="123">Synthetic programs recovered exactly</text>
    <text x="36" y="183">Source relations reproduced</text>
    <text x="36" y="243">Pass independent search A</text>
    <text x="36" y="303">Pass independent search B</text>
    <text x="36" y="363">Same program passes both searches</text>
    <text x="36" y="423">Accepted real programs</text>
  </g>
  <g fill="#e1e7ec">
    <rect x="350" y="100" width="470" height="31" rx="4"/>
    <rect x="350" y="160" width="470" height="31" rx="4"/>
    <rect x="350" y="220" width="470" height="31" rx="4"/>
    <rect x="350" y="280" width="470" height="31" rx="4"/>
    <rect x="350" y="340" width="470" height="31" rx="4"/>
    <rect x="350" y="400" width="470" height="31" rx="4"/>
  </g>
  <rect x="350" y="100" width="470" height="31" rx="4" fill="#2b8a6e"/>
  <rect x="350" y="160" width="470" height="31" rx="4" fill="#2b8a6e"/>
  <g fill="#b33a3a">
    <rect x="350" y="220" width="2" height="31" rx="1"/>
    <rect x="350" y="280" width="2" height="31" rx="1"/>
    <rect x="350" y="340" width="2" height="31" rx="1"/>
    <rect x="350" y="400" width="2" height="31" rx="1"/>
  </g>
  <g font-family="sans-serif" font-size="15" font-weight="700">
    <text x="832" y="122" fill="#2b8a6e">100% (8/8)</text>
    <text x="832" y="182" fill="#2b8a6e">100% (18/18)</text>
    <text x="362" y="242" fill="#b33a3a">0% (0/113,568)</text>
