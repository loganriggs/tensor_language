  <line x1="36" y1="454" x2="900" y2="454" stroke="#c8d0d7"/>
  <text x="36" y="480" font-family="sans-serif" font-size="14" fill="#52606d">Best real program still missed the joint cosine/residual boundary by 18.6 percentage points.</text>
  <text x="36" y="501" font-family="sans-serif" font-size="14" fill="#52606d">Confirmation and physical substitution correctly remained closed.</text>
