<svg xmlns="http://www.w3.org/2000/svg" width="940" height="390" viewBox="0 0 940 390" role="img" aria-labelledby="title desc">
  <title id="title">Rung 519 interaction-term discovery funnel</title>
  <desc id="desc">Of 46 semantic MLP0 bilinear interaction terms, 19.6 percent recovered at least 15 percent of the target effect in both halves, 6.5 percent were also stable, and zero were among the top four circuit effects or twice the median circuit effect in both halves.</desc>
  <rect width="940" height="390" fill="#ffffff"/>
  <text x="28" y="38" font-family="sans-serif" font-size="23" font-weight="700" fill="#18212f">Rung 519: no interaction term is specific to the target circuit</text>
  <text x="28" y="65" font-family="sans-serif" font-size="15" fill="#4b5563">Percentage of 46 eligible token/head-source bilinear terms surviving each cumulative rule</text>
  <g font-family="sans-serif" font-size="15" fill="#1f2937">
    <text x="28" y="116">Eligible semantic terms</text>
    <text x="28" y="174">≥15% target recovery, both halves</text>
    <text x="28" y="232">Recovery also stable within 2×</text>
    <text x="28" y="290">Target ranks in top 4 of 32, both halves</text>
    <text x="28" y="348">Target effect ≥2× circuit median, both halves</text>
  </g>
  <g>
    <rect x="365" y="91" width="500" height="31" rx="5" fill="#2563eb"/>
    <rect x="365" y="149" width="98" height="31" rx="5" fill="#3b82f6"/>
    <rect x="365" y="207" width="33" height="31" rx="5" fill="#60a5fa"/>
    <rect x="365" y="265" width="2" height="31" rx="1" fill="#93c5fd"/>
    <rect x="365" y="323" width="2" height="31" rx="1" fill="#93c5fd"/>
  </g>
  <g font-family="sans-serif" font-size="16" font-weight="700" fill="#111827">
    <text x="875" y="113">100.0% (46)</text>
    <text x="473" y="171">19.6% (9)</text>
    <text x="408" y="229">6.5% (3)</text>
    <text x="377" y="287">0.0% (0)</text>
    <text x="377" y="345">0.0% (0)</text>
  </g>
</svg>
