<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc">
  <title id="title">MLP0 grouping results from rungs 525 to 527</title>
  <desc id="desc">Rung 525's selected operator distance was 123.5 percent of the raw-token control distance and rung 526's was 186.2 percent; both had to be at most 75 percent. In rung 527 all 20 exact context terms were active, 90 of 190 pairs were materially comparable, and zero pairs passed the first document-half downstream-effect relation.</desc>
  <rect width="1120" height="610" fill="#fbfbf8"/>
  <style>
    .title{font:700 25px system-ui,sans-serif;fill:#18212b}.subtitle{font:16px system-ui,sans-serif;fill:#52606d}
    .label{font:15px system-ui,sans-serif;fill:#26323d}.small{font:13px system-ui,sans-serif;fill:#52606d}
    .value{font:700 15px system-ui,sans-serif;fill:#18212b}.axis{stroke:#9aa5b1;stroke-width:1}.grid{stroke:#d9dee3;stroke-width:1}
    .fail{fill:#d75a4a}.pass{fill:#3d8f72}.eligible{fill:#e5a742}.limit{stroke:#26323d;stroke-width:3;stroke-dasharray:7 5}
  </style>
  <text x="50" y="43" class="title">MLP0: exact structure was real, but it did not define reusable circuits</text>
  <text x="50" y="72" class="subtitle">All bars are percentages of the registered denominator; lower is better in the upper panel.</text>

  <text x="50" y="115" class="label">Chosen token-group distance relative to ordinary raw-token similarity</text>
  <line x1="350" y1="140" x2="1030" y2="140" class="axis"/><line x1="350" y1="140" x2="350" y2="275" class="axis"/>
  <line x1="520" y1="140" x2="520" y2="275" class="grid"/><line x1="690" y1="140" x2="690" y2="275" class="grid"/>
  <line x1="860" y1="140" x2="860" y2="275" class="grid"/><line x1="1030" y1="140" x2="1030" y2="275" class="grid"/>
  <text x="345" y="132" class="small">0%</text><text x="507" y="132" class="small">50%</text><text x="674" y="132" class="small">100%</text>
  <text x="842" y="132" class="small">150%</text><text x="1010" y="132" class="small">200%</text>
  <line x1="605" y1="133" x2="605" y2="275" class="limit"/><text x="612" y="154" class="small">pass ≤75%</text>
  <text x="50" y="198" class="label">R525: weight-defined operator</text><rect x="350" y="179" width="420" height="28" rx="3" class="fail"/><text x="780" y="198" class="value">123.5%</text>
  <text x="50" y="249" class="label">R526: 32-circuit gradient metric</text><rect x="350" y="230" width="633" height="28" rx="3" class="fail"/><text x="993" y="249" class="value">186.2%</text>

  <text x="50" y="334" class="label">R527 exact context terms and downstream-effect grouping</text>
  <line x1="350" y1="360" x2="1030" y2="360" class="axis"/><line x1="350" y1="360" x2="350" y2="535" class="axis"/>
  <line x1="520" y1="360" x2="520" y2="535" class="grid"/><line x1="690" y1="360" x2="690" y2="535" class="grid"/>
  <line x1="860" y1="360" x2="860" y2="535" class="grid"/><line x1="1030" y1="360" x2="1030" y2="535" class="grid"/>
  <text x="345" y="352" class="small">0%</text><text x="507" y="352" class="small">25%</text><text x="674" y="352" class="small">50%</text>
  <text x="842" y="352" class="small">75%</text><text x="1005" y="352" class="small">100%</text>
  <text x="50" y="406" class="label">Exact terms with a material CE effect</text><rect x="350" y="387" width="680" height="28" rx="3" class="pass"/><text x="935" y="406" class="value">100% (20/20)</text>
  <text x="50" y="457" class="label">Term pairs materially comparable</text><rect x="350" y="438" width="322" height="28" rx="3" class="eligible"/><text x="682" y="457" class="value">47.4% (90/190)</text>
  <text x="50" y="508" class="label">Pairs passing first repeat</text><rect x="350" y="489" width="2" height="28" class="fail"/><text x="362" y="508" class="value">0% (0/90)</text>
  <text x="50" y="570" class="subtitle">The null is not caused by dead terms: all 20 mattered, but none had the same stable circuit effect.</text>
</svg>
