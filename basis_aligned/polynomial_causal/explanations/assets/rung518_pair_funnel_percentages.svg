<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" role="img" aria-labelledby="title desc">
  <title id="title">Rung 518 pair-screen funnel as percentages of 990 pairs</title>
  <desc id="desc">All pairs were measurable, 57.8 percent had an allowed scale, 0.2 percent matched the four copy-task effects across both data halves, and zero matched the 32 circuit effects.</desc>
  <rect width="980" height="470" fill="#fbfaf7"/>
  <text x="50" y="48" font-family="sans-serif" font-size="25" font-weight="700" fill="#1f2937">R518: downstream circuits reject the head-by-source pairings</text>
  <text x="50" y="78" font-family="sans-serif" font-size="16" fill="#4b5563">Percentage of all 990 possible pairs; frozen thresholds, two document halves</text>
  <g font-family="sans-serif" font-size="16" fill="#1f2937">
    <text x="50" y="133">Measurable effect</text>
    <text x="50" y="198">Allowed fitted scale</text>
    <text x="50" y="263">Copy-task match, both halves</text>
    <text x="50" y="328">32-circuit match, half 0</text>
    <text x="50" y="393">Accepted pair</text>
  </g>
  <g fill="#e5e7eb">
    <rect x="315" y="108" width="580" height="32" rx="4"/>
    <rect x="315" y="173" width="580" height="32" rx="4"/>
    <rect x="315" y="238" width="580" height="32" rx="4"/>
    <rect x="315" y="303" width="580" height="32" rx="4"/>
    <rect x="315" y="368" width="580" height="32" rx="4"/>
  </g>
  <rect x="315" y="108" width="580" height="32" rx="4" fill="#3274a1"/>
  <rect x="315" y="173" width="335.1" height="32" rx="4" fill="#4c956c"/>
  <rect x="315" y="238" width="1.2" height="32" rx="1" fill="#e09f3e"/>
  <line x1="315" y1="303" x2="315" y2="335" stroke="#c44536" stroke-width="4"/>
  <line x1="315" y1="368" x2="315" y2="400" stroke="#c44536" stroke-width="4"/>
  <g font-family="sans-serif" font-size="17" font-weight="700" fill="#111827">
    <text x="910" y="132">100.0%</text>
    <text x="665" y="197">57.8%</text>
    <text x="330" y="262">0.2%</text>
    <text x="330" y="327">0.0%</text>
    <text x="330" y="392">0.0%</text>
  </g>
  <text x="50" y="445" font-family="sans-serif" font-size="15" fill="#4b5563">Two task-stable pairs remained, but neither matched the circuit-specific effects. Confirmation therefore stayed closed.</text>
</svg>
