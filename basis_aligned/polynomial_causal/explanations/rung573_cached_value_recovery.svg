<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Recovery of the complete L8H7 and L8H3 causal effect by the selected cached-value factor</title>
  <desc id="desc">Eight horizontal bars show 95.4 to 110.7 percent recovery across FIT and SELECT, two-line and three-line lists, and both intervention directions.</desc>
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="28" y="34" font-family="sans-serif" font-size="20" font-weight="bold" fill="#172554">Final-label layer-0 cached value recovers the two-head effect</text>
  <text x="28" y="58" font-family="sans-serif" font-size="13" fill="#475569">Percent of complete L8H7 + L8H3 donor-direction effect; 50% was the frozen pass threshold</text>
  <line x1="330" y1="78" x2="330" y2="450" stroke="#cbd5e1"/>
  <line x1="555" y1="78" x2="555" y2="450" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="780" y1="78" x2="780" y2="450" stroke="#cbd5e1"/>
  <text x="326" y="472" font-family="sans-serif" font-size="12" fill="#475569">0%</text>
  <text x="544" y="472" font-family="sans-serif" font-size="12" fill="#b91c1c">50%</text>
  <text x="766" y="472" font-family="sans-serif" font-size="12" fill="#475569">100%</text>
  <g font-family="sans-serif" font-size="13" fill="#1e293b">
    <text x="28" y="108">FIT · 2 lines · base→donor</text>
    <text x="28" y="153">FIT · 2 lines · donor→base</text>
    <text x="28" y="198">FIT · 3 lines · base→donor</text>
    <text x="28" y="243">FIT · 3 lines · donor→base</text>
    <text x="28" y="288">SELECT · 2 lines · base→donor</text>
    <text x="28" y="333">SELECT · 2 lines · donor→base</text>
    <text x="28" y="378">SELECT · 3 lines · base→donor</text>
    <text x="28" y="423">SELECT · 3 lines · donor→base</text>
  </g>
  <g fill="#2563eb">
    <rect x="330" y="90" width="452" height="24" rx="4"/>
    <rect x="330" y="135" width="453" height="24" rx="4"/>
    <rect x="330" y="180" width="436" height="24" rx="4"/>
    <rect x="330" y="225" width="437" height="24" rx="4"/>
  </g>
  <g fill="#0f766e">
    <rect x="330" y="270" width="432" height="24" rx="4"/>
    <rect x="330" y="315" width="429" height="24" rx="4"/>
    <rect x="330" y="360" width="498" height="24" rx="4"/>
    <rect x="330" y="405" width="494" height="24" rx="4"/>
  </g>
  <g font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">
    <text x="790" y="108">100.4%</text><text x="791" y="153">100.6%</text>
    <text x="774" y="198">96.9%</text><text x="775" y="243">97.2%</text>
    <text x="770" y="288">96.0%</text><text x="767" y="333">95.4%</text>
    <text x="836" y="378">110.7%</text><text x="832" y="423">109.7%</text>
  </g>
  <rect x="680" y="18" width="14" height="14" fill="#2563eb"/><text x="700" y="30" font-family="sans-serif" font-size="12" fill="#334155">FIT</text>
  <rect x="744" y="18" width="14" height="14" fill="#0f766e"/><text x="764" y="30" font-family="sans-serif" font-size="12" fill="#334155">SELECT</text>
</svg>
